name: Build ESP32‑C3‑AdBlock
on:
  workflow_dispatch: # 允许网页手动点击运行编译

jobs:
  build_firmware:
    runs-on: ubuntu‑latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PlatformIO
        uses: platformio/action@v3

      - name: Compile c3 firmware
        run: pio run -e c3

      - name: Download compiled bin files
        uses: actions/upload‑artifact@v4
        with:
          name: esp32‑c3‑firmware
          path: |
            .pio/build/c3/bootloader.bin
            .pio/build/c3/partitions.bin
            .pio/build/c3/firmware.bin
